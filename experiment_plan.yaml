# experiment_plan.yaml — skyfall (SILVA)
# Declares the deterministic scenario conditions and expected outputs.

mission: SILVA
film: skyfall
scenario:
  entry: internet
  target: registry
  defenders: [Mallory, Tanner, Q, Eve]
  remediation_budget: 3
  base_survival: 0.8
  containment_hops: 6
primary_metrics:
  - shortest_intrusion_hops
  - cheapest_intrusion_hops
  - fleet_mean_exposure
  - fleet_critical_count
  - num_choke_points
  - defensive_coverage
expected_figures:
  - output/figures/estate_defense.png
baseline: fixed_scenario_constants
ablation: none_required_deterministic
